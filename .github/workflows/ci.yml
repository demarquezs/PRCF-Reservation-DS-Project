  name: MLOps CI/CD Pipeline

  on:
    push:
      branches:
        - master
        - main

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        # Step 1 - Checkout the repo
        - name: Checkout repository
          uses: actions/checkout@v4

        # Step 2 - Set up Python
        - name: Set up Python 3.12
          uses: actions/setup-python@v4
          with:
            python-version: "3.12"

        # Step 3 - Install dependencies
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements_mlops.txt
            pip install pytest


        # Step 4 - Run all tests
        - name: Run tests
          run: pytest -q --maxfail=1 --disable-warnings -v


    build_and_push:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Build Docker image
          run: docker build -t ${{ secrets.REGISTRY }}/${{ github.repository }}:latest .

        - name: Log in to the Docker registry
          run: |
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

        - name: Push Docker image
          run: docker push ${{ secrets.REGISTRY }}/${{ github.repository }}:latest

    