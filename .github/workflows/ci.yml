  name: MLOps CI/CD Pipeline

  on:
    push:
      branches:
        - master
        - main

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:

        # Step 1 - Checkout the repo
        - name: Checkout repository
          uses: actions/checkout@v4


        # Step 2 - Set up Python
        - name: Set up Python 3.12
          uses: actions/setup-python@v4
          with:
            python-version: "3.12"


        # Add a PYTHONPATH    
        - name: Add src to PYTHONPATH
          run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV


        # Step 3 - Install dependencies
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements_mlops.txt
            pip install pytest


        # Step 4 - Linting check (ensures code style consistency)
        - name: Run linting (flake8)
          run: |
            echo "Running flake8 linting..."
            flake8 src tests --max-line-length=120 || echo "Linting warnings detected"


        # Step 5 - Run all tests
        - name: Run tests and save report
          run: |
            mkdir -p reports
            pytest -q --junitxml=reports/test-results.xml || echo "Tests completed with some errors"

        
        - name: Upload test results as artifact
          uses: actions/upload-artifact@v4
          with:
            name: pytest-results
            path: reports/test-results.xml


    build_and_push:
      needs: test
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Prepare lowercase image name
          id: prep
          run: |
            REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "repo_name=$REPO_NAME" >> $GITHUB_ENV

        - name: Log in to GitHub Container Registry
          run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

        - name: Build Docker image
          run: docker build -t ghcr.io/${{ env.repo_name }}:latest .

        - name: Push Docker image
          run: docker push ghcr.io/${{ env.repo_name }}:latest


    run_prefect_pipeline:
      needs: build_and_push
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4 

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: "3.12"

        - name: Install Prefect and dependencies
          run: |
            pip install -r requirements_mlops.txt
            pip install prefect mlflow

        - name: Run Prefect pipeline
          run: python src/pipeline.py || echo "Prefect flow executed with warnings"       
    
