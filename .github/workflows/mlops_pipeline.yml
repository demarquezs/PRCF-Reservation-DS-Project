name: MLOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "data/**"
      - "models/**"
      - "requirements_mlops.txt"
      - "api/**"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements_mlops.txt

      - name: Run pipeline
        run: python -m src.pipeline

      - name: Verify model file exists
        run: |
          echo "Checking model file..."
          ls -lh models/

      - name: Upload trained model
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: models/best_model_pipeline.pkl

  deploy:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download trained model
        uses: actions/download-artifact@v3
        with:
          name: trained-model
          path: models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/prcf-api:latest

  run_prefect_pipeline:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Prefect flow
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_WORKSPACE: ${{ secrets.PREFECT_WORKSPACE }}
          PREFECT_DEPLOYMENT_NAME: ${{ secrets.PREFECT_DEPLOYMENT_NAME }}
        run: |
          pip install prefect
          prefect cloud login -k $PREFECT_API_KEY
          prefect config set PREFECT_DEFAULT_WORKSPACE=$PREFECT_WORKSPACE
          prefect deployment run $PREFECT_DEPLOYMENT_NAME
